# Local development override: source mounted with reload, ports published on localhost only.
services:
  postgres:
    ports: ["127.0.0.1:5433:5432"]

  redis:
    ports: ["127.0.0.1:6380:6379"]

  migrate:
    build:
      target: dev

  api:
    build:
      target: dev
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    volumes:
      - ./backend:/srv
      - ./docs:/docs:ro
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://referral_app:${REFERRAL_APP_PASSWORD}@postgres:5432/referral_test
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://referral_owner:${REFERRAL_OWNER_PASSWORD}@postgres:5432/referral_test
      TEST_REDIS_URL: redis://redis:6379/15
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build:
      target: dev
    volumes:
      - ./backend:/srv

  beat:
    build:
      target: dev
    volumes:
      - ./backend:/srv

  nginx:
    ports: ["127.0.0.1:8080:80"]
