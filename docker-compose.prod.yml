# Production override. TLS terminates at Nginx; certificates are mounted from the host.
# Only Nginx publishes ports. Secrets come from .env (or a secret manager rendering it).
services:
  postgres:
    deploy:
      resources:
        limits: { memory: 2g }
    logging: &logging
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  redis:
    logging: *logging

  migrate:
    logging: *logging

  api:
    environment:
      APP_ENV: prod
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 1g }
    logging: *logging

  worker:
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--pool=prefork", "--concurrency=4", "--loglevel=INFO"]
    environment:
      APP_ENV: prod
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }
    logging: *logging

  beat:
    environment:
      APP_ENV: prod
    deploy:
      replicas: 1   # exactly one scheduler
    logging: *logging

  nginx:
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/prod.d:/etc/nginx/conf.d:ro
      - ${TLS_CERT_DIR:-/etc/referral/tls}:/etc/nginx/tls:ro
    logging: *logging
