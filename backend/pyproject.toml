[project]
name = "referral-platform-backend"
version = "0.1.0"
description = "Centralized referral and commission platform: API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4,<6",
    "prometheus-client>=0.21",
    "typer>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.118",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "celery-types>=0.22",
    "asyncpg-stubs>=0.30",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "DTZ", "T20", "SIM", "RUF", "PT", "ASYNC", "PL", "N",
]
ignore = [
    "PLR0913",  # many args is normal for service functions with keyword-only params
    "PLR2004",  # magic values are fine in tests and constants modules
    "S101",     # assert is used in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PLR0915"]
"migrations/**" = ["N999"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
files = ["app", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL and Redis (DATABASE_URL / REDIS_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
