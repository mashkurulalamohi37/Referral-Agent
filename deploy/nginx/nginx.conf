worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # JSON access log without client IP or query string (§15: no raw signals in logs;
    # query strings can carry attribution tokens).
    log_format json_safe escape=json
        '{"ts":"$time_iso8601","host":"$host","method":"$request_method","path":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","request_id":"$req_id"}';
    access_log /dev/stdout json_safe;
    error_log /dev/stderr warn;

    # Propagate the caller's X-Request-ID if present, otherwise generate one.
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # Basic rate limits (§2). Fine-grained per-client limits live in the API (Redis buckets).
    limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
