name: referral-platform

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://referral_app:${REFERRAL_APP_PASSWORD}@postgres:5432/referral
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      REFERRAL_OWNER_PASSWORD: ${REFERRAL_OWNER_PASSWORD}
      REFERRAL_APP_PASSWORD: ${REFERRAL_APP_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5441}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d referral"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6387}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://referral_app:${REFERRAL_APP_PASSWORD}@postgres:5432/referral
      MIGRATION_DATABASE_URL: postgresql+asyncpg://referral_owner:${REFERRAL_OWNER_PASSWORD}@postgres:5432/referral
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "${API_PORT:-9007}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "api"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--pool=prefork", "--concurrency=2", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "beat"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  portal:
    build:
      context: ./frontend/portal
    ports:
      - "${PORTAL_PORT:-3015}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./frontend/admin
    ports:
      - "${ADMIN_PORT:-3016}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8085}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/server.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_started
      admin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
